<!doctype html><html><head><meta charset="utf-8">
<!-- Plantilla de etiquetas animadas. render_frames.js la abre con ?total=<s>&items=<json> y la congela fotograma a fotograma. -->
<style>
html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden}
.stack{position:absolute;left:80px;bottom:110px;display:flex;flex-direction:column;align-items:flex-start;gap:18px}
.card{position:relative;display:flex;align-items:center;gap:20px;padding:18px 36px 18px 20px;border-radius:999px;opacity:0;overflow:hidden;
  background:linear-gradient(135deg,rgba(14,16,30,.93),rgba(30,18,44,.93));box-shadow:0 18px 50px rgba(0,0,0,.45)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:3px;background:var(--borde);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.ico{flex:none;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--fondo-ico)}
.ico svg{width:38px;height:38px}
.txt{display:flex;flex-direction:column;gap:4px}
.kick{font:600 20px/1 "Inter",sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#9be8f7}
.main{font:800 50px/1.05 "Inter Display","Inter",sans-serif;color:#fff;white-space:nowrap;clip-path:inset(0 100% 0 0)}
.main.mono{font:700 44px/1.1 "DejaVu Sans Mono",monospace}
.main b{background:linear-gradient(90deg,#22d3ee,#ff2d95);-webkit-background-clip:text;background-clip:text;color:transparent}
.shine{position:absolute;top:0;bottom:0;width:140px;left:-200px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.25),transparent);transform:skewX(-18deg)}
</style></head><body>
<div class="stack" id="stack"></div>
<script>
const P = new URLSearchParams(location.search);
const items = JSON.parse(P.get('items'));
const total = +P.get('total');
const ICONOS = {
  web: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.8 2.6 4.2 5.8 4.2 9.5s-1.4 6.9-4.2 9.5M12 2.5C9.2 5.1 7.8 8.3 7.8 12s1.4 6.9 4.2 9.5"/></svg>',
  archivo: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M14 2.5H6.5a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V8z"/><path d="M14 2.5V8h5.5"/></svg>',
  dato: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 7.5v.01M12 11v6"/><circle cx="12" cy="12" r="9.5"/></svg>',
  precio: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5" fill="#fff"/></svg>',
  pin: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="#fff"/></svg>',
  consejo: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M9 18h6M10 21.5h4M12 2.5a6.5 6.5 0 0 0-4 11.6c.6.5 1 1.2 1 2V16h6v-.1c0-.8.4-1.5 1-2A6.5 6.5 0 0 0 12 2.5z"/></svg>'
};
const DEGRADADO = 'linear-gradient(90deg,#22d3ee,#a855f7,#ff2d95)';
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const salida = (total - 0.55) * 1000;
items.forEach((it, k) => {
  const c = document.createElement('div'); c.className = 'card';
  // color: color del cable para "pin"; si no, el degradado de la marca
  const col = it.color || null;
  c.style.setProperty('--borde', col ? `linear-gradient(90deg,${col},${col}88)` : DEGRADADO);
  c.style.setProperty('--fondo-ico', col ? col : DEGRADADO.replace('90deg', '135deg'));
  let main = esc(it.texto);
  if (it.tipo === 'web') { const p = main.lastIndexOf('.'); main = main.slice(0, p) + '<b>' + main.slice(p) + '</b>'; }
  c.innerHTML = `<div class="ico">${ICONOS[it.tipo] || ICONOS.dato}</div><div class="txt">` +
    (it.titulo ? `<div class="kick">${esc(it.titulo)}</div>` : '') +
    `<div class="main${it.tipo === 'archivo' ? ' mono' : ''}">${main}</div></div><div class="shine"></div>`;
  document.getElementById('stack').appendChild(c);
  const a = it.at * 1000;
  c.animate([{opacity:0,transform:'translateX(-120px) scale(.85)',filter:'blur(10px)'},{opacity:1,transform:'translateX(14px) scale(1.03)',filter:'blur(0)',offset:.7},{opacity:1,transform:'none'}],{duration:450,delay:a,fill:'both',easing:'cubic-bezier(.2,.9,.3,1.2)'});
  c.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateY(30px) scale(.95)'}],{duration:450,delay:salida+k*80,fill:'forwards',easing:'ease-in'});
  c.querySelector('.main').animate([{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0 0 0)'}],{duration:Math.min(900,250+it.texto.length*25),delay:a+200,fill:'both',easing:`steps(${Math.max(8,it.texto.length)},end)`});
  c.querySelector('.shine').animate([{left:'-200px'},{left:'110%'}],{duration:900,delay:a+1000,fill:'both',easing:'ease-in-out'});
  c.querySelector('.ico').animate([{transform:'rotate(-90deg) scale(.4)'},{transform:'rotate(0) scale(1)'}],{duration:600,delay:a+80,fill:'both',easing:'cubic-bezier(.2,.9,.3,1.3)'});
});
window.seek = ms => document.getAnimations().forEach(x => { x.pause(); x.currentTime = ms; });
</script></body></html>
